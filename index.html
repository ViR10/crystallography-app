            <h1>CrystalloGraphy — Interactive 3D Crystallography Learning Platform</h1>
            <p><strong>CrystalloGraphy</strong> is the premier interactive learning platform for materials science, metallurgy, and solid-state physics students to master Miller Indices, directional vectors [uvw], and crystal planes (hkl).</p>
            
            <h2>Core Educational Topics</h2>
            <ul>
                <li><a href="/learn/fundamentals"><strong>Crystallography Fundamentals</strong></a>: Crystal lattices, unit cell geometry, Simple Cubic (SC) corner atoms, coordination numbers, and 3D Cartesian coordinates.</li>
                <li><a href="/learn/miller-indices"><strong>Crystallographic Directions [uvw]</strong></a>: Vector coordinate math, square bracket notation, origin shifting rules for negative indices, and direction families &lt;uvw&gt;.</li>
                <li><a href="/learn/crystal-planes"><strong>Crystal Planes (hkl)</strong></a>: Axial intercepts, reciprocal space inversion, clearing fractions with LCM, and planes parallel to axes with infinity.</li>
                <li><a href="/practice"><strong>Practice Arena</strong></a>: 300+ randomized questions, Blitz time attacks, and Boss Battles.</li>
                <li><a href="/sandbox"><strong>3D Expert Sandbox</strong></a>: Freeform rotatable Simple Cubic unit cell simulator.</li>
                <li><a href="/about"><strong>About ViR Developers &amp; Adeel Shahid</strong></a>: Creator profiles and platform architectural information.</li>
            </ul>

            <h2>What are Miller Indices?</h2>
            <p>Miller indices are a notation system in crystallography for planes in crystal lattices. They are represented as three integers (hkl) for planes or [uvw] for directional vectors, derived from the reciprocals of fractional axial intercepts.</p>
