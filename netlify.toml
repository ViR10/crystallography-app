# Netlify Configuration for CrystalloGraphy
# https://crystallography.netlify.app/

[build]
  command = "npm run build"
  publish = "dist"

# Environment configuration
[build.environment]
  NODE_VERSION = "20"

# Permanent redirect for legacy /progress to /dashboard
[[redirects]]
  from = "/progress"
  to = "/dashboard"
  status = 301
  force = true

# Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
